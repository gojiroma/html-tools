<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--bg:#f6f5f1;--pane:#fbfaf7;--fg:#24231f;--sub:#7a786f;--line:#e1dfd6;--card:#fff;--accent:#c96442;--me:#eaf0fa;--hit:#ffe08a;--code:#efede6}
@media(prefers-color-scheme:dark){:root{--bg:#181816;--pane:#1f1f1c;--fg:#e9e8e2;--sub:#9a988e;--line:#35342f;--card:#262623;--accent:#e0805f;--me:#27344a;--hit:#7a5d00;--code:#2d2c28}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.65 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.lnk{border:0;background:none;color:var(--sub);cursor:pointer;padding:0;font-size:12px;text-decoration:underline}

#bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--pane)}
#bar .sp{flex:1}
#bar .info{color:var(--sub);font-size:12px}
#err{display:none;background:#fdecea;color:#b3261e;padding:6px 12px;font-size:12px;white-space:pre-wrap}
#tabs{display:none;border-bottom:1px solid var(--line);background:var(--pane)}
#tabs button{flex:1;border:0;background:none;padding:8px;cursor:pointer;border-bottom:2px solid transparent}
body[data-pane="cal"] #tabs [data-pane="cal"],body[data-pane="list"] #tabs [data-pane="list"],body[data-pane="reader"] #tabs [data-pane="reader"]{border-bottom-color:var(--accent);font-weight:600}

#app{flex:1;min-height:0;display:grid;grid-template-columns:272px 360px 1fr}
.pane{min-height:0;overflow:auto;border-right:1px solid var(--line);background:var(--pane)}
#reader{border-right:0;background:var(--bg)}
body.dragover #app{outline:3px dashed var(--accent);outline-offset:-6px}

/* calendar */
.cal-top{position:sticky;top:0;z-index:1;background:var(--pane);border-bottom:1px solid var(--line)}
.cal-sub{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 4px;color:var(--sub);font-size:12px}
.month{padding:8px 10px 2px}
.mtitle{display:flex;justify-content:space-between;align-items:baseline;width:100%;border:0;background:none;cursor:pointer;padding:0 2px 3px;font-weight:600;font-size:13px;text-align:left}
.mtitle small{font-weight:400;color:var(--sub);font-size:11px}
.mtitle.on{color:var(--accent);text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{text-align:center;font-size:11px;color:var(--sub)}
.dow.sun{color:#d05a5a}.dow.sat{color:#5a7fd0}
.day{height:24px;border:1px solid transparent;border-radius:6px;background:color-mix(in srgb,var(--line) 45%,transparent);cursor:pointer;font-size:12px;padding:0}
.day:hover{border-color:var(--accent)}
.day.l1{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.day.l2{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.day.l3{background:color-mix(in srgb,var(--accent) 72%,transparent);color:#fff}
.day.l4{background:color-mix(in srgb,var(--accent) 95%,transparent);color:#fff}
.day.today{border:1px dotted var(--sub)}
.day.sel{border:2px solid var(--fg)}
.legend{display:flex;align-items:center;gap:3px;padding:10px 12px;color:var(--sub);font-size:11px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}

/* list */
.searchbox{position:sticky;top:0;background:var(--pane);padding:10px;border-bottom:1px solid var(--line);z-index:2}
#q{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
#q:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent)}
#filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#filters:empty{display:none}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--sub)}
#chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;max-height:96px;overflow:auto}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12px;overflow:hidden}
.chip button{border:0;background:none;cursor:pointer;padding:2px 8px}
.chip button:hover{color:var(--accent)}
.chip .x{padding:2px 7px 2px 0;color:var(--sub)}
#count{padding:6px 12px;color:var(--sub);font-size:12px}
.item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.item.sel{background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 3px 0 var(--accent)}
.it-top{display:flex;align-items:center;gap:6px}
.it-title{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{border:0;background:none;cursor:pointer;color:var(--sub);font-size:17px;line-height:1;padding:0 2px}
.star:hover{color:#e0a100}
.star.on{color:#e0a100}
#rhead h1 .star{font-size:20px;vertical-align:-2px;margin-right:4px}
.favrow{margin-top:6px}
.btn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nohit{color:var(--sub);text-align:center;margin:28px 16px;font-size:13px}
.it-meta{color:var(--sub);font-size:11px}
.it-snip{color:var(--sub);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
#more{display:block;margin:10px auto}

/* reader */
#rhead{padding:14px 18px 6px;max-width:860px;margin:0 auto}
#rhead h1{font-size:18px;margin:0 0 2px}
#rhead .meta{color:var(--sub);font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#rhead details{margin-top:6px}
#rhead summary{cursor:pointer;color:var(--sub);font-size:12px}
.sumbody{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;margin-top:6px}
#msgs{max-width:860px;margin:0 auto;padding:0 18px 60px}
.msg{border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:12px 0;background:var(--card)}
.msg.human{background:var(--me);margin-left:10%}
.who{font-size:11px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.md{word-break:break-word;overflow-wrap:anywhere}
.md>:first-child{margin-top:.3em}.md>:last-child{margin-bottom:.3em}
.md pre{background:var(--code);padding:10px;border-radius:8px;overflow:auto;font-size:12px}
.md code{background:var(--code);padding:1px 4px;border-radius:4px;font-size:.92em}
.md pre code{background:none;padding:0}
.md blockquote{margin:.5em 0;padding:0 12px;border-left:3px solid var(--line);color:var(--sub)}
.md table{border-collapse:collapse;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line);padding:4px 8px}
.md img{max-width:100%}
.md a{color:var(--accent)}
.blk{font-size:12px;margin:6px 0}
.blk summary{cursor:pointer;color:var(--sub)}
.blk pre{white-space:pre-wrap;background:var(--code);padding:8px;border-radius:6px;overflow:auto;margin:4px 0 0}
mark{background:var(--hit);color:inherit;border-radius:2px;padding:0 1px}
mark.cur{outline:2px solid var(--accent)}
.empty{color:var(--sub);text-align:center;margin:80px 20px}
.hitnav{display:inline-flex;align-items:center;gap:4px}
.hitnav button{border:1px solid var(--line);background:var(--card);border-radius:4px;cursor:pointer;padding:0 6px}

@media(max-width:900px){
  #tabs{display:flex}
  #app{grid-template-columns:1fr}
  .pane{display:none;border-right:0}
  body[data-pane="cal"] #p-cal,body[data-pane="list"] #p-list,body[data-pane="reader"] #reader{display:block}
  .msg.human{margin-left:4%}
}
</style>
</head>
<body data-pane="list">
<div id="bar">
  <b>Chat Viewer</b>
  <span class="info" id="info"></span>
  <span class="sp"></span>
  <button id="clear" class="btn" hidden>保存データを削除</button>
  <label class="btn">ファイルを開く<input id="file" type="file" accept=".json,.txt,application/json" multiple hidden></label>
</div>
<div id="err"></div>
<nav id="tabs">
  <button data-pane="cal">カレンダー</button>
  <button data-pane="list">スレッド</button>
  <button data-pane="reader">本文</button>
</nav>
<div id="app">
  <section class="pane" id="p-cal">
    <div class="cal-top">
      <div class="cal-sub"><span id="calinfo"></span><button id="latest" class="btn">最新へ</button></div>
      <div class="grid" id="dowrow" style="padding:0 10px 4px"></div>
    </div>
    <div id="months"></div>
    <div class="legend">少<i class="day"></i><i class="day l1"></i><i class="day l2"></i><i class="day l3"></i><i class="day l4"></i>多<span style="margin-left:auto">月名クリックで月絞り込み</span></div>
  </section>
  <section class="pane" id="p-list">
    <div class="searchbox">
      <input id="q" type="search" placeholder="タイトル・本文を検索（空白でAND／ひらがな⇔カタカナ・全角⇔半角を区別しない）" autocomplete="off">
      <div class="favrow"><button id="favbtn" class="btn"><span id="favmark">☆</span> お気に入りのみ <span id="favcnt">0</span></button></div>
      <div id="filters"></div>
      <div class="hist-head"><span>検索履歴</span><button id="histclear" class="lnk">全削除</button></div>
      <div id="chips"></div>
    </div>
    <div id="count"></div>
    <div id="list"></div>
  </section>
  <section class="pane" id="reader">
    <div id="rhead"></div>
    <div id="msgs"><div class="empty">JSONファイルをドロップ、または右上の「ファイルを開く」から選択</div></div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const LS_KEY="chatviewer.searchHistory.v1";
const isNarrow=()=>matchMedia("(max-width:900px)").matches;
const FAV_KEY="chatviewer.favorites.v1",FAVONLY_KEY="chatviewer.favOnly.v1";
function loadFavs(){
  try{const o=JSON.parse(localStorage.getItem(FAV_KEY)||"{}");return o&&typeof o==="object"&&!Array.isArray(o)?o:{}}catch(e){return{}}
}
function saveFavs(){try{localStorage.setItem(FAV_KEY,JSON.stringify(favs))}catch(e){}}
let favs=loadFavs();
let favOnly=false;
try{favOnly=localStorage.getItem(FAVONLY_KEY)==="1"}catch(e){}

let threads=[],byId=new Map();
let range=null;           // "YYYY-MM-DD" | "YYYY-MM"
let rawQuery="",terms=[]; // terms = folded
let filtered=[],heatSource=[];
let selId=null,shown=150,maxDayAll="",minDayAll="";
const PAGE=150;

/* ---------- 正規化(ひらがな/カタカナ/全角/半角/大小文字を吸収) ---------- */
const KATA=/[ァ-ヶヽヾ]/g;
const COMB=/[̀-゙゚ͯﾞﾟ]/;
function foldChunk(s){
  return s.normalize("NFKC").toLowerCase().replace(KATA,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
// 文字ごとに元位置との対応を持つ版(ハイライト・スニペット用)
function foldMap(s){
  let norm="";const start=[],end=[];
  for(let i=0;i<s.length;){
    let j=i+(s.codePointAt(i)>0xFFFF?2:1);
    while(j<s.length&&COMB.test(s[j]))j++;
    const n=foldChunk(s.slice(i,j));
    for(let k=0;k<n.length;k++){start.push(i);end.push(j)}
    norm+=n;i=j;
  }
  return{norm,start,end};
}
const mapCache=new Map();
function getMap(t){
  if(!mapCache.has(t.id)){if(mapCache.size>300)mapCache.clear();mapCache.set(t.id,foldMap(t.raw))}
  return mapCache.get(t.id);
}

/* ---------- データ読み込み ---------- */
function normalizeInput(data){
  const isConv=o=>o&&typeof o==="object"&&("chat_messages" in o||"messages" in o);
  if(Array.isArray(data)){
    if(data.length&&isConv(data[0]))return data;
    return[{name:"messages",chat_messages:data}];
  }
  if(isConv(data))return[data];
  throw new Error("メッセージの配列が見つかりませんでした");
}
function blocks(m){
  const out=[];
  if(Array.isArray(m.content)&&m.content.length){
    m.content.forEach(b=>{
      if(!b)return;
      if(b.type==="text"&&b.text)out.push({k:"text",v:b.text});
      else if(b.type==="thinking"){const s=b.summaries&&b.summaries[0]&&b.summaries[0].summary;const v=b.thinking||s;if(v)out.push({k:"thinking",v})}
      else if(b.type==="tool_use")out.push({k:"tool",v:(b.name||"tool")+"\n"+JSON.stringify(b.input||{},null,2)});
      else if(b.type==="tool_result")out.push({k:"result",v:typeof b.content==="string"?b.content:JSON.stringify(b.content,null,2)});
    });
  }
  if(!out.some(b=>b.k==="text")){
    const tx=typeof m.text==="string"?m.text:(typeof m.content==="string"?m.content:"");
    if(tx)out.unshift({k:"text",v:tx});
  }
  return out;
}
function dayKeyOf(t){
  if(!t)return"";const d=new Date(t);
  return isNaN(d)?"":`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function buildThread(c,i){
  const rawMsgs=c.chat_messages||c.messages||[];
  const msgs=rawMsgs.map(m=>({sender:m.sender||m.role||"",time:m.created_at||m.timestamp||"",bl:blocks(m)}));
  const created=c.created_at||(msgs.find(m=>m.time)||{}).time||"";
  const updated=c.updated_at||(msgs.length?msgs[msgs.length-1].time:"")||created;
  const days=new Map();
  msgs.forEach(m=>{const d=dayKeyOf(m.time||created);if(d)days.set(d,(days.get(d)||0)+1)});
  const raw=msgs.map(m=>m.bl.filter(b=>b.k==="text").map(b=>b.v).join("\n")).join("\n");
  const name=c.name||c.title||"";
  const firstHuman=msgs.find(m=>/^(human|user)$/.test(m.sender)&&m.bl.some(b=>b.k==="text"));
  const preview=((firstHuman?firstHuman.bl.find(b=>b.k==="text").v:raw)||"").replace(/\s+/g," ").slice(0,90);
  return{
    id:String(i),key:String(c.uuid||c.id||("n:"+name+"|"+created)),name,created,updated,summary:c.summary||"",msgs,days,raw,preview,
    ts:Date.parse(updated)||Date.parse(created)||0,
    titleN:foldChunk(name),allN:foldChunk(name+"\n"+raw),html:[]
  };
}
async function loadFiles(files){
  let all=[];const errs=[];
  for(const f of files){
    try{all=all.concat(normalizeInput(JSON.parse(await f.text())))}
    catch(e){errs.push(f.name+": "+e.message)}
  }
  showErr(errs);
  if(all.length||!errs.length){
    savedAt=all.length?Date.now():0;
    setThreads(all);
    if(all.length)saveData(all);
  }
}
function showErr(errs){
  const box=$("err");
  box.style.display=errs.length?"block":"none";box.textContent=errs.join("\n");
}

/* ---------- IndexedDB 永続化 ---------- */
const DB_NAME="chatviewer",STORE="kv";
let savedAt=0;
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
async function idbGet(k){
  const db=await idb();
  return new Promise((res,rej)=>{const q=db.transaction(STORE).objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
}
async function idbSet(k,v){
  const db=await idb();
  return new Promise((res,rej)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error)});
}
async function idbDel(k){
  const db=await idb();
  return new Promise((res,rej)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(k);tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error)});
}
async function saveData(convs){
  try{
    await idbSet("data",{convs,savedAt});
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){showErr(["ブラウザへの保存に失敗しました: "+(e&&e.message||e)])}
}
$("clear").onclick=async()=>{
  if(!confirm("保存済みのデータを削除します。よろしいですか？"))return;
  try{await idbDel("data")}catch(e){}
  savedAt=0;setThreads([]);
  $("msgs").innerHTML='<div class="empty">JSONファイルをドロップ、または右上の「ファイルを開く」から選択</div>';
};
function setThreads(all){
  threads=all.map(buildThread);
  byId=new Map(threads.map(t=>[t.id,t]));
  mapCache.clear();
  maxDayAll="";minDayAll="";
  threads.forEach(t=>t.days.forEach((_,d)=>{if(d>maxDayAll)maxDayAll=d;if(!minDayAll||d<minDayAll)minDayAll=d}));
  range=null;selId=null;
  const total=threads.reduce((a,t)=>a+t.msgs.length,0);
  $("info").textContent=threads.length?`${threads.length}スレッド / ${total}メッセージ`+(savedAt?` ・ 保存 ${fmtDate(savedAt)}`:""):"";
  $("clear").hidden=!threads.length;
  applyFilters();
  if(filtered.length)openThread(filtered[0].id,{keepPane:true});
  else clearReader();
}
/* ---------- 絞り込み ---------- */
function hasRange(t,r){for(const k of t.days.keys())if(k.startsWith(r))return true;return false}
function applyFilters(){
  updateFavUI();
  let arr=favOnly?threads.filter(t=>favs[t.key]):threads;
  if(terms.length)arr=arr.filter(t=>terms.every(x=>t.allN.includes(x)));
  heatSource=arr;
  if(range)arr=arr.filter(t=>hasRange(t,range));
  const tHit=t=>terms.length&&terms.every(x=>t.titleN.includes(x))?0:1;
  filtered=arr.slice().sort((a,b)=>tHit(a)-tHit(b)||b.ts-a.ts);
  shown=PAGE;
  renderCal();renderFilters();renderList();
}
function setRange(r){
  range=r;applyFilters();
  if(isNarrow())setPane("list");
}

/* ---------- ハイライト ---------- */
function hlText(text){
  const frag=document.createDocumentFragment();
  if(!terms.length||!text){frag.append(text||"");return frag}
  const fm=foldMap(text);const ranges=[];
  for(const x of terms){let i=0,p;while((p=fm.norm.indexOf(x,i))>=0){ranges.push([fm.start[p],fm.end[p+x.length-1]]);i=p+x.length}}
  if(!ranges.length){frag.append(text);return frag}
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged=[];
  for(const r of ranges){const l=merged[merged.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else merged.push([r[0],r[1]])}
  let pos=0;
  for(const[a,b]of merged){
    if(a>pos)frag.append(text.slice(pos,a));
    const m=document.createElement("mark");m.textContent=text.slice(a,b);frag.append(m);pos=b;
  }
  if(pos<text.length)frag.append(text.slice(pos));
  return frag;
}
function highlightDOM(root){
  if(!terms.length)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
  nodes.forEach(nd=>{
    if(!nd.nodeValue.trim())return;
    const frag=hlText(nd.nodeValue);
    if(frag.querySelector("mark"))nd.replaceWith(frag);
  });
}
function snip(t){
  if(terms.length){
    const fm=getMap(t);let best=-1;
    for(const x of terms){const p=fm.norm.indexOf(x);if(p>=0&&(best<0||p<best))best=p}
    if(best>=0){
      const s=fm.start[best];
      return(s>24?"…":"")+t.raw.slice(Math.max(0,s-24),s+90).replace(/\s+/g," ");
    }
  }
  return t.preview;
}

/* ---------- カレンダー ---------- */
const dk=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function renderCal(){
  const heat=new Map();
  heatSource.forEach(t=>t.days.forEach((n,d)=>heat.set(d,(heat.get(d)||0)+n)));
  let max=0;heat.forEach(c=>{if(c>max)max=c});
  const now=new Date(),todayK=dk(now.getFullYear(),now.getMonth(),now.getDate());
  const hi=maxDayAll||todayK,lo=minDayAll||todayK;
  let y=+hi.slice(0,4),m=+hi.slice(5,7)-1;
  const ly=+lo.slice(0,4),lm=+lo.slice(5,7)-1;
  const frag=document.createDocumentFragment();
  let total=0;
  while(y>ly||(y===ly&&m>=lm)){
    const dim=new Date(y,m+1,0).getDate(),dow=new Date(y,m,1).getDay();
    const mkey=`${y}-${pad(m+1)}`;
    const g=document.createElement("div");g.className="grid";
    for(let i=0;i<dow;i++)g.append(document.createElement("div"));
    let sum=0;
    for(let d=1;d<=dim;d++){
      const key=dk(y,m,d),c=heat.get(key)||0;sum+=c;
      const lv=c?Math.min(4,Math.ceil(4*Math.sqrt(c/max))):0;
      const b=document.createElement("button");
      b.className="day l"+lv+(range===key?" sel":"")+(key===todayK?" today":"");
      b.textContent=d;b.dataset.k=key;b.title=c?`${key}：${c}メッセージ`:key;
      g.append(b);
    }
    const wrap=document.createElement("div");wrap.className="month";
    const mt=document.createElement("button");mt.className="mtitle"+(range===mkey?" on":"");mt.dataset.k=mkey;
    const a=document.createElement("span");a.textContent=`${y}年${m+1}月`;
    const sm=document.createElement("small");sm.textContent=sum?`${sum}件`:"";
    mt.append(a,sm);wrap.append(mt,g);frag.append(wrap);
    total+=sum;
    if(m===0){y--;m=11}else m--;
  }
  const pane=$("p-cal"),st=pane.scrollTop;
  $("months").replaceChildren(frag);
  pane.scrollTop=st;
  $("calinfo").textContent=`全${total}メッセージ`;
}
$("months").addEventListener("click",e=>{
  const b=e.target.closest("[data-k]");if(!b)return;
  setRange(range===b.dataset.k?null:b.dataset.k);
});
$("latest").onclick=()=>{$("p-cal").scrollTop=0};
"日月火水木金土".split("").forEach((w,i)=>{
  const e=document.createElement("div");e.className="dow"+(i===0?" sun":i===6?" sat":"");e.textContent=w;$("dowrow").append(e);
});

/* ---------- スレッドリスト ---------- */
function fmtDate(t){
  const d=new Date(t);if(isNaN(d))return"";
  return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function itemEl(t){
  const d=document.createElement("div");
  d.className="item"+(t.id===selId?" sel":"");d.dataset.id=t.id;
  const h=document.createElement("div");h.className="it-title";h.append(hlText(t.name||"(無題)"));
  const m=document.createElement("div");m.className="it-meta";m.textContent=`${fmtDate(t.updated||t.created)} · ${t.msgs.length}件`;
  const s=document.createElement("div");s.className="it-snip";s.append(hlText(snip(t)));
  const top=document.createElement("div");top.className="it-top";top.append(h,makeStar(t));
  d.append(top,m,s);
  return d;
}
function renderList(){
  $("count").textContent=threads.length?`${filtered.length} / ${threads.length} スレッド`:"";
  const frag=document.createDocumentFragment();
  filtered.slice(0,shown).forEach(t=>frag.append(itemEl(t)));
  if(filtered.length>shown){
    const b=document.createElement("button");b.id="more";b.className="btn";
    b.textContent=`さらに表示（残り${filtered.length-shown}件）`;
    b.onclick=()=>{shown+=PAGE;renderList()};
    frag.append(b);
  }
  if(!filtered.length&&threads.length){
    const e=document.createElement("div");e.className="nohit";
    e.textContent=favOnly&&!Object.keys(favs).length?"お気に入りはまだありません。スレッドの☆で登録できます":"該当するスレッドがありません";
    frag.append(e);
  }
  $("list").replaceChildren(frag);
}
$("list").addEventListener("click",e=>{
  const it=e.target.closest(".item");if(it)openThread(it.dataset.id);
});
/* ---------- お気に入り ---------- */
function makeStar(t){
  const on=!!favs[t.key];
  const b=document.createElement("button");
  b.className="star"+(on?" on":"");b.dataset.id=t.id;b.textContent=on?"★":"☆";b.title="お気に入り";
  return b;
}
function updateStarEls(t){
  const on=!!favs[t.key];
  document.querySelectorAll('.star[data-id="'+t.id+'"]').forEach(el=>{el.classList.toggle("on",on);el.textContent=on?"★":"☆"});
}
function updateFavUI(){
  const n=threads.reduce((a,t)=>a+(favs[t.key]?1:0),0);
  $("favbtn").classList.toggle("on",favOnly);
  $("favmark").textContent=favOnly?"★":"☆";
  $("favcnt").textContent=n;
}
function toggleFav(t){
  if(favs[t.key])delete favs[t.key];else favs[t.key]=Date.now();
  saveFavs();updateStarEls(t);updateFavUI();
  if(favOnly)applyFilters();
}
// リスト・本文どちらの☆も、スレッドを開く処理より先にここで受ける
document.addEventListener("click",e=>{
  const b=e.target.closest(".star");if(!b)return;
  e.stopPropagation();
  const t=byId.get(b.dataset.id);if(t)toggleFav(t);
},true);
$("favbtn").onclick=()=>{
  favOnly=!favOnly;
  try{localStorage.setItem(FAVONLY_KEY,favOnly?"1":"0")}catch(e){}
  applyFilters();
};
function renderFilters(){
  const box=$("filters");box.replaceChildren();
  if(range){
    const c=document.createElement("span");c.className="chip";
    const b=document.createElement("button");b.textContent="期間: "+range;
    const x=document.createElement("button");x.className="x";x.textContent="×";
    b.onclick=x.onclick=()=>setRange(null);
    c.append(b,x);box.append(c);
  }
}

/* ---------- リーダー ---------- */
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderMd(text){
  const fallback=()=>escapeHtml(text).replace(/\n/g,"<br>");
  try{
    const html=marked.parse(text,{gfm:true,breaks:true});
    if(typeof html!=="string"||!window.DOMPurify)return fallback();
    return DOMPurify.sanitize(html);
  }catch(e){return fallback()}
}
function fixLinks(root){root.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener noreferrer"})}
let hits=[],hitIdx=-1;
function updateHitNav(){
  const el=$("hitcnt");if(el)el.textContent=hits.length?`${hitIdx<0?0:hitIdx+1}/${hits.length}`:"0";
}
function goHit(d){
  if(!hits.length)return;
  hitIdx=(hitIdx+d+hits.length)%hits.length;
  hits.forEach(h=>h.classList.remove("cur"));
  const h=hits[hitIdx];h.classList.add("cur");h.scrollIntoView({block:"center"});
  updateHitNav();
}
function clearReader(){
  $("rhead").replaceChildren();
  $("msgs").innerHTML='<div class="empty">スレッドを選択してください</div>';
  hits=[];hitIdx=-1;
}
function renderReader(t,{scroll=true}={}){
  const head=$("rhead");head.replaceChildren();
  const h1=document.createElement("h1");h1.append(makeStar(t),hlText(t.name||"(無題)"));
  const meta=document.createElement("div");meta.className="meta";
  const info=document.createElement("span");
  info.textContent=`${fmtDate(t.created)} 〜 ${fmtDate(t.updated)} ・ ${t.msgs.length}件`;
  meta.append(info);
  if(terms.length){
    const nav=document.createElement("span");nav.className="hitnav";
    nav.innerHTML='<button id="hprev" title="前のヒット">▲</button><button id="hnext" title="次のヒット">▼</button><span id="hitcnt"></span>';
    meta.append(nav);
  }
  head.append(h1,meta);
  if(t.summary){
    const d=document.createElement("details");
    const s=document.createElement("summary");s.textContent="要約";
    const b=document.createElement("div");b.className="sumbody";b.innerHTML=renderMd(t.summary);fixLinks(b);
    d.append(s,b);head.append(d);
  }
  const box=$("msgs");box.replaceChildren();
  t.msgs.forEach((m,mi)=>{
    const hum=/^(human|user)$/.test(m.sender);
    const d=document.createElement("div");d.className="msg "+(hum?"human":"ai");
    const w=document.createElement("div");w.className="who";
    const a=document.createElement("span");a.textContent=hum?"人間":(m.sender==="assistant"?"AI":m.sender||"?");
    const tm=document.createElement("span");tm.textContent=fmtDate(m.time);
    w.append(a,tm);d.append(w);
    m.bl.forEach((b,bi)=>{
      if(b.k==="text"){
        const row=t.html[mi]||(t.html[mi]=[]);
        if(row[bi]===undefined)row[bi]=renderMd(b.v);
        const p=document.createElement("div");p.className="md";p.innerHTML=row[bi];
        fixLinks(p);highlightDOM(p);d.append(p);
      }else{
        const det=document.createElement("details");det.className="blk";
        const s=document.createElement("summary");
        s.textContent={thinking:"思考",tool:"ツール呼び出し",result:"ツール結果"}[b.k];
        const pre=document.createElement("pre");pre.textContent=b.v;
        det.append(s,pre);d.append(det);
      }
    });
    box.append(d);
  });
  hits=[...box.querySelectorAll("mark")];hitIdx=-1;updateHitNav();
  const pv=$("hprev"),nx=$("hnext");
  if(pv){pv.onclick=()=>goHit(-1);nx.onclick=()=>goHit(1)}
  if(scroll&&hits.length)goHit(1);
  else if(scroll)$("reader").scrollTop=0;
}
function openThread(id,{keepPane=false}={}){
  const t=byId.get(id);if(!t)return;
  selId=id;
  $("list").querySelectorAll(".item").forEach(el=>el.classList.toggle("sel",el.dataset.id===id));
  renderReader(t);
  if(isNarrow()&&!keepPane)setPane("reader");
}

/* ---------- 検索・履歴 ---------- */
function loadHist(){
  try{const a=JSON.parse(localStorage.getItem(LS_KEY)||"[]");return Array.isArray(a)?a.filter(h=>h&&typeof h.q==="string"):[]}catch(e){return[]}
}
function storeHist(a){try{localStorage.setItem(LS_KEY,JSON.stringify(a))}catch(e){}}
function saveHistory(){
  const q=rawQuery.trim();if(!q)return;
  let hist=loadHist();const key=foldChunk(q),now=Date.now();
  // 打ち込み途中の語（直前の履歴の延長）は置き換える
  if(hist[0]&&q.startsWith(hist[0].q)&&now-hist[0].t<15000)hist.shift();
  hist=[{q,t:now},...hist.filter(h=>foldChunk(h.q)!==key)].slice(0,30);
  storeHist(hist);renderHistory();
}
function renderHistory(){
  const box=$("chips");box.replaceChildren();
  const hist=loadHist();
  hist.forEach(h=>{
    const c=document.createElement("span");c.className="chip";
    const b=document.createElement("button");b.textContent=h.q;b.title=new Date(h.t).toLocaleString("ja-JP");
    b.onclick=()=>{$("q").value=h.q;rawQuery=h.q;runSearch();saveHistory()};
    const x=document.createElement("button");x.className="x";x.textContent="×";x.title="履歴から削除";
    x.onclick=()=>{storeHist(loadHist().filter(v=>!(v.q===h.q&&v.t===h.t)));renderHistory()};
    c.append(b,x);box.append(c);
  });
  $("histclear").style.visibility=hist.length?"visible":"hidden";
}
$("histclear").onclick=()=>{storeHist([]);renderHistory()};

let searchTmr,idleTmr,readerTmr;
function runSearch(){
  terms=foldChunk(rawQuery.trim()).split(/\s+/).filter(Boolean);
  applyFilters();
  clearTimeout(readerTmr);
  readerTmr=setTimeout(()=>{const t=byId.get(selId);if(t)renderReader(t)},150);
}
$("q").addEventListener("input",()=>{
  rawQuery=$("q").value;
  clearTimeout(searchTmr);searchTmr=setTimeout(runSearch,60);
  clearTimeout(idleTmr);idleTmr=setTimeout(saveHistory,1500);
});
$("q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();clearTimeout(idleTmr);saveHistory()}
});
$("q").addEventListener("blur",()=>{clearTimeout(idleTmr);saveHistory()});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();$("q").focus()}
});

/* ---------- ペイン切替(狭い画面) / ファイル入力 ---------- */
function setPane(p){document.body.dataset.pane=p}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setPane(b.dataset.pane)});
$("file").addEventListener("change",e=>{if(e.target.files.length)loadFiles([...e.target.files]);e.target.value=""});
let dragDepth=0;
addEventListener("dragenter",e=>{e.preventDefault();dragDepth++;document.body.classList.add("dragover")});
addEventListener("dragover",e=>e.preventDefault());
addEventListener("dragleave",()=>{if(--dragDepth<=0){dragDepth=0;document.body.classList.remove("dragover")}});
addEventListener("drop",e=>{
  e.preventDefault();dragDepth=0;document.body.classList.remove("dragover");
  if(e.dataTransfer.files.length)loadFiles([...e.dataTransfer.files]);
});

renderHistory();
updateFavUI();
renderCal();
// 前回保存したデータがあれば自動で表示
(async()=>{
  try{
    const d=await idbGet("data");
    if(d&&Array.isArray(d.convs)&&d.convs.length){savedAt=d.savedAt||0;setThreads(d.convs)}
  }catch(e){}
})();
</script>
